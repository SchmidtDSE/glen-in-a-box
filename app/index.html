<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glen in a Box — offline US census explorer</title>

    <!--
        OFFLINE BUILD. Every URL below is same-origin and resolves inside this
        container. Nothing here reaches the internet — that is the entire point
        of this file, and the one property to preserve when editing it.

        Two differences from the standard geo-agent template you should expect:

        1. No `integrity=` attributes. SRI protects bytes in transit from a
           third-party CDN; these files were already verified against pinned
           sha384 digests when they were fetched at image build time (see
           vendor/manifest.tsv and vendor/fetch.sh). Re-checking a same-origin
           file the image itself shipped adds nothing, and would only create a
           way for a legitimate rebuild to fail.

        2. The import map points at locally bundled MCP SDK modules rather than
           esm.sh. esm.sh modules cannot simply be downloaded — they carry
           transitive imports back to esm.sh — so vendor/bundle-mcp-sdk.sh
           builds them into standalone ES modules with a shared chunk.

        Adding a <script src="https://..."> here silently breaks the air gap.
        Vendor it in app/vendor/manifest.tsv instead.
    -->

    <script type="importmap">
    {
        "imports": {
            "@modelcontextprotocol/sdk/client/index.js": "/vendor/mcp/client-index.js",
            "@modelcontextprotocol/sdk/client/streamableHttp.js": "/vendor/mcp/client-streamableHttp.js"
        }
    }
    </script>

    <!-- MapLibre GL JS -->
    <script src="/vendor/maplibre-gl/maplibre-gl.js"></script>
    <link href="/vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />

    <!-- PMTiles protocol -->
    <script src="/vendor/pmtiles/pmtiles.js"></script>

    <!-- h3-js (hex grid overlay) -->
    <script src="/vendor/h3-js/h3-js.umd.js"></script>

    <!-- Markdown rendering -->
    <script src="/vendor/marked/marked.umd.js"></script>

    <!-- HTML sanitizer — chat-ui.js refuses to render markdown without it -->
    <script src="/vendor/dompurify/purify.min.js"></script>

    <!-- Code highlighting -->
    <link rel="stylesheet" href="/vendor/highlight/github-dark.min.css">
    <script src="/vendor/highlight/highlight.min.js"></script>
    <script src="/vendor/highlight/sql.min.js"></script>

    <!-- Core styles: a patched snapshot of geo-agent, baked into this image -->
    <link rel="stylesheet" href="/app/style.css">
    <link rel="stylesheet" href="/app/chat.css">
    <link rel="stylesheet" href="/app/sidebar.css">
</head>

<body>
    <!-- Map -->
    <div id="map"></div>

    <!-- Layer controls — generated by MapManager.generateMenu() -->
    <div id="menu"></div>

    <!-- Boot -->
    <script type="module" src="/app/main.js"></script>
</body>

</html>
