# Air-gap verification overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.airgap.yml up
#   (or: make up-airgap)
#
# Cuts outbound networking so that any service still reaching for the internet
# fails loudly here instead of quietly working on your dev machine and breaking
# in the field.
#
# ── No ingress, by design ────────────────────────────────────────────────────
# `internal: true` drops the containers' default route AND stops published ports
# from working, so this overlay gives you a stack with no way in from the host.
# That is deliberate. The obvious workaround — a second, non-internal network on
# webapp to carry the published port — does not work reliably: with one network
# internal, docker's embedded DNS starts forwarding service names to a resolver
# it cannot reach and answers SERVFAIL, so every proxied route 502s. Compose
# accepts a `priority` on each network to break the tie, and this Docker leaves
# GwPriority at 0 regardless, which is why that appeared to work once and then
# stopped.
#
# So: verify from inside the network instead.
#
#     make up-airgap
#     make verify-airgap
#
# ── What this proves, and what it does not ───────────────────────────────────
# PROVES: llm, mcp, rustfs, titiler and basemap need no internet at run time.
#         Those are the services that would otherwise fetch a DuckDB extension,
#         a model file, or a remote tile, and here they cannot.
#
# DOES NOT PROVE: that the BROWSER is offline-clean — it runs on your host with
#         its own network. For that, the honest test is the physical one: run the
#         normal stack, turn this machine's networking off, reload the page, and
#         watch the DevTools network tab for any request whose origin is not
#         PUBLIC_ORIGIN. See docs/offline.md.

services:
  # `pull_policy: never` turns a missing image into an immediate error rather
  # than a registry timeout — the failure you actually want in an air gap.
  webapp:  { pull_policy: never }
  llm:     { pull_policy: never }
  rustfs:  { pull_policy: never }
  mcp:     { pull_policy: never }
  titiler: { pull_policy: never }
  basemap: { pull_policy: never }

networks:
  glen:
    internal: true
